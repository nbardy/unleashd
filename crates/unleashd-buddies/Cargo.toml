[package]
name = "unleashd-buddies"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["node"]
# The napi bindings. Off for `cargo test` of the pure core, which must link without Node.
node = ["dep:napi", "dep:napi-derive", "dep:tokio"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "functions", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
croner = "2"
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt"], optional = true }
napi-derive = { version = "3", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"
